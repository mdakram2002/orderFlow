name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: services/${{ matrix.service }}
      - run: pytest tests
        working-directory: services/${{ matrix.service }}

  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, product-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm test
        working-directory: ${{ matrix.service }}
      - run: npm run build
        working-directory: ${{ matrix.service }}

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway
            image: orderflow-gateway
            file: gateway/Dockerfile
          - service: user-service
            image: orderflow-user-service
            file: services/user-service/Dockerfile
          - service: product-service
            image: orderflow-product-service
            file: services/product-service/Dockerfile
          - service: order-service
            image: orderflow-order-service
            file: services/order-service/Dockerfile
          - service: payment-service
            image: orderflow-payment-service
            file: services/payment-service/Dockerfile
          - service: notification-service
            image: orderflow-notification-service
            file: services/notification-service/Dockerfile
          - service: frontend
            image: orderflow-frontend
            file: frontend/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            API_GATEWAY_URL=${{ matrix.service == 'frontend' && 'http://gateway:3000' || '' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [python, node, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 over SSH when deployment secrets are configured
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_DEPLOY_PATH" ] || [ -z "$EC2_SSH_PRIVATE_KEY" ] || [ -z "$EC2_KNOWN_HOSTS" ]; then
            echo "EC2 deployment secrets are not configured; skipping deployment."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/orderflow"
          chmod 600 "$HOME/.ssh/orderflow"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/orderflow" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && cd '$EC2_DEPLOY_PATH' && git pull --ff-only && docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail http://localhost:30000/health && curl --fail http://localhost:30001; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
      - if: always()
        run: docker compose down -v
