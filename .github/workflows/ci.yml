name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: services/${{ matrix.service }}
      - run: pytest tests
        working-directory: services/${{ matrix.service }}

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - services/product-service
          - services/payment-service
          - services/notification-service
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - if: matrix.service == 'services/notification-service'
        run: npm run check
        working-directory: ${{ matrix.service }}
      - if: matrix.service == 'frontend'
        run: npm run build
        working-directory: ${{ matrix.service }}
      - if: matrix.service != 'services/notification-service' && matrix.service != 'frontend'
        run: npm test
        working-directory: ${{ matrix.service }}
      - if: matrix.service != 'services/notification-service' && matrix.service != 'frontend'
        run: npm run build
        working-directory: ${{ matrix.service }}

  e2e:
    runs-on: ubuntu-latest
    needs: [python, node]
    env:
      NODE_ENV: development
      JWT_SECRET: ci-orderflow-test-secret-with-more-than-32-characters
      JWT_EXPIRES_SECONDS: "3600"
      ADMIN_EMAILS: ""
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_ci_only
      USER_DATABASE_URL: postgresql+psycopg://orderflow:orderflow_ci_only@postgres:5432/user_db
      ORDER_DATABASE_URL: postgresql+psycopg://orderflow:orderflow_ci_only@postgres:5432/order_db
      PAYMENT_DATABASE_URL: postgresql://orderflow:orderflow_ci_only@postgres:5432/payment_db
      PAYMENT_MODE: success
      SEED_DEMO_DATA: "true"
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Build and wait for the complete stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Confirm all services are healthy
        run: docker compose ps
      - name: Run Playwright end-to-end tests
        env:
          API_BASE_URL: http://localhost:30000/api
          PLAYWRIGHT_BASE_URL: http://localhost:30001
        run: npm test
        working-directory: tests/e2e
      - name: Show Compose status and logs after failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200
      - name: Stop E2E stack and remove its data
        if: always()
        run: docker compose down --volumes --remove-orphans
