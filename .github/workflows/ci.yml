name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: services/${{ matrix.service }}
      - run: pytest tests
        working-directory: services/${{ matrix.service }}

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, product-service, payment-service, services/notification-service]
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - if: matrix.service != 'services/notification-service'
        run: npm test
        working-directory: ${{ matrix.service }}
      - if: matrix.service != 'services/notification-service'
        run: npm run build
        working-directory: ${{ matrix.service }}
      - if: matrix.service == 'services/notification-service'
        run: npm run check
        working-directory: ${{ matrix.service }}

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            image: orderflow-gateway
            file: gateway/Dockerfile
          - service: user-service
            image: orderflow-user-service
            file: services/user-service/Dockerfile
          - service: product-service
            image: orderflow-product-service
            file: services/product-service/Dockerfile
          - service: order-service
            image: orderflow-order-service
            file: services/order-service/Dockerfile
          - service: payment-service
            image: orderflow-payment-service
            file: services/payment-service/Dockerfile
          - service: notification-service
            image: orderflow-notification-service
            file: services/notification-service/Dockerfile
          - service: frontend
            image: orderflow-frontend
            file: frontend/Dockerfile
    permissions:
      contents: read
      packages: write
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            API_GATEWAY_URL=${{ matrix.service == 'frontend' && 'http://gateway:3000' || '' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [python, node, docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to EC2 over SSH when deployment secrets are configured
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_DEPLOY_PATH" ] || [ -z "$EC2_SSH_PRIVATE_KEY" ] || [ -z "$EC2_KNOWN_HOSTS" ]; then
            echo "EC2 deployment secrets are not configured; skipping deployment."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/orderflow"
          chmod 600 "$HOME/.ssh/orderflow"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/orderflow" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && cd '$EC2_DEPLOY_PATH' && git pull --ff-only && docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d"

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    env:
      NODE_ENV: development
      JWT_SECRET: ci-orderflow-test-secret-with-more-than-32-characters
      JWT_EXPIRES_SECONDS: "3600"
      ADMIN_EMAILS: ""
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_ci_only
      USER_DATABASE_URL: postgresql+psycopg://orderflow:orderflow_ci_only@postgres:5432/user_db
      ORDER_DATABASE_URL: postgresql+psycopg://orderflow:orderflow_ci_only@postgres:5432/order_db
      PAYMENT_DATABASE_URL: postgresql://orderflow:orderflow_ci_only@postgres:5432/payment_db
      PAYMENT_MODE: success
      SEED_DEMO_DATA: "true"
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Build and wait for the complete stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Confirm all services are healthy
        run: docker compose ps
      - name: Run Playwright end-to-end tests
        env:
          API_BASE_URL: http://localhost:30000/api
          PLAYWRIGHT_BASE_URL: http://localhost:30001
        run: npm test
        working-directory: tests/e2e
      - name: Show Compose status and logs after failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200
      - name: Stop E2E stack and remove its data
        if: always()
        run: docker compose down --volumes --remove-orphans
