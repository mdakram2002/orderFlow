syntax = "proto3";

package orderflow.product.v1;

service ProductService {
  rpc GetProduct(GetProductRequest) returns (ProductResponse);
  rpc CheckInventory(InventoryRequest) returns (InventoryResponse);
  rpc ReserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResponse);
  rpc ReleaseInventory(ReleaseInventoryRequest) returns (ReleaseInventoryResponse);
}

message GetProductRequest { string product_id = 1; }
message ProductResponse {
  string product_id = 1;
  string name = 2;
  string category = 3;
  int64 price_minor = 4;
  string currency = 5;
  int32 stock = 6;
  bool found = 7;
}
message InventoryRequest {
  string product_id = 1;
  int32 quantity = 2;
}
message InventoryResponse { bool available = 1; int32 available_quantity = 2; }
message ReserveInventoryRequest {
  string order_id = 1;
  string product_id = 2;
  int32 quantity = 3;
}
message ReserveInventoryResponse { bool reserved = 1; string reason = 2; }
message ReleaseInventoryRequest {
  string order_id = 1;
  string product_id = 2;
  int32 quantity = 3;
}
message ReleaseInventoryResponse { bool released = 1; }

